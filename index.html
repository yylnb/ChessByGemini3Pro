<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Chess</title>
    <meta name="description" content="A premium, static chess web application with local storage persistence.">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <header>
            <h1>Grandmaster Chess</h1>
            <div class="game-info">
                <div class="turn-indicator" id="turnIndicator">
                    <span class="turn-dot"></span>
                    <span id="turnText">White's Turn</span>
                </div>
                <div class="status-message" id="statusMessage"></div>
            </div>
        </header>

        <main>
            <div class="board-wrapper">
                <div class="chess-board" id="chessBoard">
                    <!-- Board squares will be generated by JS -->
                </div>
                <div class="coordinates-left"></div>
                <div class="coordinates-bottom"></div>
            </div>

            <div class="controls">
                <button id="undoBtn" class="btn secondary" title="Undo last move">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 14L4 9l5-5" />
                        <path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11" />
                    </svg>
                    Undo
                </button>
                <button id="resetBtn" class="btn danger" title="Start a new game">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                        <path d="M3 3v5h5" />
                    </svg>
                    New Game
                </button>
            </div>
        </main>
    </div>

    <!-- Promotion Modal -->
    <div id="promotionModal" class="modal hidden">
        <div class="modal-content">
            <h2>Promote Pawn</h2>
            <div class="promotion-options" id="promotionOptions">
                <!-- Options injected by JS -->
            </div>
        </div>
    </div>

    <script src="script.js?v=2"></script>
</body>

</html>
